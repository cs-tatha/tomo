services:
  # TOMO Backend API & Real-Time Socket Service
  - type: web
    name: tomo-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: tomo-database
          property: connectionString
      - key: CLIENT_URL
        value: "*"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CHAT_MESSAGE_TTL_SECONDS
        value: 86400

databases:
  # Free Managed PostgreSQL Database
  - name: tomo-database
    databaseName: tomo
    user: tomo_user
    plan: free
    region: oregon
