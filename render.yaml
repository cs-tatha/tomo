services:
  # TOMO Backend API & Real-Time Socket Service
  - type: web
    name: tomo-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: tomo-database
          property: connectionString
      - key: CLIENT_URL
        value: "*"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CHAT_MESSAGE_TTL_SECONDS
        value: 86400

  # TOMO Frontend Web Application (Static Site)
  - type: web
    name: tomo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://tomo-backend-7k0l.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://tomo-backend-7k0l.onrender.com

databases:
  # Free Managed PostgreSQL Database
  - name: tomo-database
    databaseName: tomo
    user: tomo_user
    plan: free
    region: oregon
